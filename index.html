<title>استبيان بيانات الخدمات — مجلس الجمعيات الأهلية بالشرقية</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ══ ألوان هوية مجلس الجمعيات الأهلية بالشرقية — كحلي + أزرق ══ */
:root{
  --bg:#FFFFFF;
  --sf:#F7F7F5;
  --tx:#0A0A0A;
  --tx2:#404040;
  --tx3:#888888;
  --bd:#111111;       /* حدود قوية */
  --bd2:#E0E0DC;      /* فواصل خفيفة */
  --bdi:#D5D5CE;      /* حدود الحقول — رفيعة وهادئة */
  --grn:#172D76;      /* كحلي الهوية */
  --grn-h:#175EFC;    /* أزرق الهوية عند التحويم */
  --ov:#4FBCFD;       /* سماوي الشعار */
  --ac:#172D76;       /* اللون الأساسي */
  --ac-tx:#FFFFFF;    /* النص فوق الأساسي */
  --inp:#FFFFFF;
  --err:#CC2200;
  --ring:rgba(23,94,252,.16);
  --font:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'Geeza Pro', Arial, sans-serif;
}
:root[data-theme=dark]{
  --bg:#000000; --sf:#111111; --tx:#FFFFFF; --tx2:#BBBBBB; --tx3:#6E6E6E;
  --bd:#FFFFFF; --bd2:#2C2C2C; --bdi:#4A4A4A; --inp:#000000;
  --grn:#5B9DFF; --grn-h:#7FB6FF; --ov:#6FD8FD;
  --ac:#175EFC; --ac-tx:#FFFFFF;
  --err:#FF6B55; --ring:rgba(91,157,255,.24);
}

html,body{
  min-height:100vh;background:var(--bg);color:var(--tx);
  font-family:var(--font);direction:rtl;-webkit-font-smoothing:antialiased;
  line-height:1.5;
}
html{font-size:16px;}   /* المقياس الأساسي — يتضاعف على الشاشات الكبيرة */
body{font-size:1rem;}

/* ─── شريط التقدم ─── */
.pline{position:fixed;top:0;left:0;right:0;height:3px;background:var(--sf);z-index:200;}
.pfill{height:100%;background:var(--ac);transition:width .5s cubic-bezier(.65,0,.35,1);}

/* ─── الهيكل ─── */
.shell{min-height:100vh;display:flex;flex-direction:column;padding-top:3px;}
.topbar{
  padding:1.4rem 2rem 0;display:flex;align-items:center;
  flex-wrap:wrap;row-gap:.45rem;
  max-width:31.25rem;width:100%;margin:0 auto;gap:.75rem;
}
body.wide .topbar{max-width:58rem;}
.logo{height:2.55rem;width:auto;max-width:100%;display:block;}
.logo-dark{display:none;}
:root[data-theme=dark] .logo-light{display:none;}
:root[data-theme=dark] .logo-dark{display:block;}
.bar-right{display:flex;align-items:center;gap:.8rem;min-width:0;margin-inline-start:auto;}
.step-lbl{font-size:.7rem;color:var(--tx3);font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.saved{
  font-size:.66rem;color:var(--tx3);white-space:nowrap;
  opacity:0;transition:opacity .3s;
}
.saved.on{opacity:1;}
.icon-btn{background:none;border:none;cursor:pointer;font-size:.95rem;color:var(--tx2);line-height:1;padding:.15rem;}

.content{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1.5rem 1.5rem;}
.stage-wrap{width:100%;max-width:54rem;position:relative;min-height:1px;}

/* ─── انتقال الشاشات ─── */
.screen{
  width:100%;max-width:27.5rem;margin-inline:auto;
  transition:opacity .28s ease, transform .28s ease;
}
.screen.wide{max-width:100%;}   /* شاشة البند الكامل — تستغل عرض الشاشة */
.screen.entering{opacity:0;transform:translateY(14px);}
.screen.active{opacity:1;transform:translateY(0);}
.screen.exiting{
  position:absolute;top:0;left:0;right:0;opacity:0;transform:translateY(-8px);
  pointer-events:none;z-index:1;
}

/* ─── الخطوط ─── */
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.02em;color:var(--grn);margin-bottom:.55rem;}
.scr-title{
  font-size:1.85rem;font-weight:700;letter-spacing:-.025em;line-height:1.2;
  margin-bottom:.5rem;color:var(--tx);text-wrap:balance;
}
.scr-sub{font-size:.9rem;color:var(--tx2);line-height:1.6;margin-bottom:1.7rem;}
.scr-sub.tight{margin-bottom:1.1rem;}
/* ─── قبل البدء: نقاط بسيطة بدون صناديق ─── */
.lede{
  font-size:.9rem;color:var(--tx2);line-height:1.65;margin-bottom:1.5rem;
  padding-right:.9rem;border-right:3px solid var(--ov);
}
.lede strong{color:var(--tx);font-weight:600;}
.plain-h{
  font-size:.68rem;font-weight:700;color:var(--tx3);letter-spacing:.06em;
  margin-bottom:.7rem;
}
.plain-list{list-style:none;margin-bottom:1.6rem;}
.plain-list li{
  font-size:.87rem;color:var(--tx2);line-height:1.55;
  padding:.34rem 0 .34rem 0;position:relative;padding-right:1.1rem;
}
.plain-list li::before{
  content:"";position:absolute;right:.2rem;top:.83rem;
  width:5px;height:5px;border-radius:50%;background:var(--ov);
}
.plain-list li b{color:var(--tx);font-weight:600;}

/* ─── الموافقة ─── */
.agree{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:1.4rem;cursor:pointer;}
.chk{
  width:1.375rem;height:1.375rem;border-radius:.4rem;border:2px solid var(--bd);background:var(--inp);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:background .16s,border-color .16s;margin-top:.1rem;cursor:pointer;
}
.chk.on{background:var(--ac);border-color:var(--ac);}
.chk svg{display:none;}
.chk.on svg{display:block;}
.chk svg path{stroke:var(--ac-tx);}
.agree-lbl{font-size:.85rem;color:var(--tx2);line-height:1.55;}
.agree-lbl strong{color:var(--tx);font-weight:600;}

/* ─── الحقول ─── */
.fields{display:flex;flex-direction:column;gap:.7rem;margin-bottom:1.5rem;}
.field{display:flex;flex-direction:column;gap:.3rem;}
.field-lbl{font-size:.7rem;font-weight:700;color:var(--tx2);padding-right:.15rem;}
.field-inp{
  background:var(--inp);border:1px solid var(--bdi);border-radius:.7rem;
  padding:.78rem 1rem;font-size:.97rem;color:var(--tx);
  font-family:var(--font);outline:none;width:100%;
  transition:box-shadow .18s,border-color .18s;
}
.field-inp::placeholder{color:var(--tx3);}
.field-inp:focus{border-color:var(--grn);box-shadow:0 0 0 3px var(--ring);}
.field-inp.bad{border-color:var(--err);}
.field-note{font-size:.7rem;color:var(--err);display:none;padding-right:.15rem;}
.field-note.on{display:block;}


/* ─── صفوف السنوات ─── */
.yr-list{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.7rem;}
.yr-item{
  display:grid;grid-template-columns:auto 1px 1fr auto;align-items:center;gap:.85rem;
  background:var(--inp);border:1px solid var(--bdi);border-radius:.65rem;padding:.72rem .95rem;
  transition:box-shadow .18s,border-color .18s;
}
.yr-item:focus-within{border-color:var(--grn);box-shadow:0 0 0 3px var(--ring);}
.yr-item.bad,.num-field.bad,.ta-wrap.bad,.pr-in.bad,.sup-wrap.bad{border-color:var(--err);}
.yr-tag{font-size:.76rem;font-weight:700;color:var(--tx2);font-variant-numeric:tabular-nums;}
.yr-divider{height:1.125rem;width:1px;background:var(--bd2);}
.yr-val{
  background:transparent;border:none;outline:none;
  font-size:1.05rem;font-weight:600;color:var(--tx);
  font-variant-numeric:tabular-nums;text-align:right;
  font-family:var(--font);width:100%;direction:ltr;
}
.yr-val::placeholder{color:var(--tx3);font-weight:400;}
.yr-unit{font-size:.72rem;font-weight:600;color:var(--tx3);white-space:nowrap;}

/* ─── كتلة سنة مُجزّأة حسب المكوّنات (الأنظمة الصوتية) ─── */
.yb{
  display:grid;grid-template-columns:auto minmax(0,1fr);
  background:var(--inp);border:1px solid var(--bdi);border-radius:.65rem;
  overflow:hidden;transition:box-shadow .18s,border-color .18s;
}
.yb:focus-within{border-color:var(--grn);box-shadow:0 0 0 3px var(--ring);}
.yb-yr{                                  /* عمود السنة — يمتد بمحاذاة المكوّنات الثلاثة */
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;
  min-width:4.5rem;padding:.6rem .8rem;background:var(--sf);
  border-inline-end:1px solid var(--bd2);
}
.yb-yr span{font-size:.68rem;font-weight:600;color:var(--tx3);}
.yb-yr b{font-size:1.05rem;font-weight:700;color:var(--tx2);font-variant-numeric:tabular-nums;}
.yb-rows{display:flex;flex-direction:column;min-width:0;}
.pr{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(6rem,9rem);
  align-items:center;gap:.7rem;padding:.55rem .85rem;
}
.pr + .pr{border-top:1px solid var(--bd2);}
.pr-lbl{font-size:.8rem;font-weight:600;color:var(--tx2);line-height:1.35;min-width:0;overflow-wrap:anywhere;}
.pr-in{
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:.45rem;
  background:var(--bg);border:1px solid var(--bdi);border-radius:.5rem;padding:.35rem .55rem;
  transition:box-shadow .18s,border-color .18s;
}
.pr-in:focus-within{border-color:var(--grn);}
.pr-val{
  background:transparent;border:none;outline:none;
  font-size:.98rem;font-weight:600;color:var(--tx);
  font-variant-numeric:tabular-nums;text-align:right;
  font-family:var(--font);width:100%;min-width:0;direction:ltr;
}
.pr-val::placeholder{color:var(--tx3);font-weight:400;}
.pr-unit{font-size:.66rem;font-weight:600;color:var(--tx3);white-space:nowrap;}
/* ─── حقل رقمي مفرد ─── */
.num-field{
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:.85rem;
  background:var(--inp);border:1px solid var(--bdi);border-radius:.65rem;padding:.72rem .95rem;
  transition:box-shadow .18s,border-color .18s;margin-bottom:1.5rem;
}
.num-field:focus-within{border-color:var(--grn);box-shadow:0 0 0 3px var(--ring);}
.num-inp{
  background:transparent;border:none;outline:none;
  font-size:1.3rem;font-weight:700;color:var(--tx);
  font-variant-numeric:tabular-nums;width:100%;
  direction:ltr;text-align:right;font-family:var(--font);
}
.num-inp::placeholder{color:var(--tx3);font-weight:400;font-size:.95rem;}
.num-unit{font-size:.76rem;font-weight:600;color:var(--tx3);}

/* ─── حقل الموردين والمقاولين — سطر واحد ─── */
.sup-wrap{
  background:var(--inp);border:1px solid var(--bdi);border-radius:.65rem;
  padding:.72rem .95rem;transition:box-shadow .18s,border-color .18s;
}
.sup-wrap:focus-within{border-color:var(--grn);box-shadow:0 0 0 3px var(--ring);}
.sup-inp{
  background:transparent;border:none;outline:none;width:100%;
  font-size:.95rem;color:var(--tx);font-family:var(--font);
}
.sup-inp::placeholder{color:var(--tx3);}

/* ─── حقل نصي (المواصفات) ─── */
.ta-wrap{
  background:var(--inp);border:1px solid var(--bdi);border-radius:.65rem;
  padding:.75rem .95rem .5rem;margin-bottom:1.5rem;
  transition:box-shadow .18s,border-color .18s;
}
.ta-wrap:focus-within{border-color:var(--grn);box-shadow:0 0 0 3px var(--ring);}
.ta{
  background:transparent;border:none;outline:none;resize:none;
  width:100%;min-height:6.5rem;font-size:.95rem;line-height:1.7;
  color:var(--tx);font-family:var(--font);
}
.ta::placeholder{color:var(--tx3);}
.ta-foot{
  display:flex;justify-content:space-between;align-items:center;
  font-size:.68rem;color:var(--tx3);border-top:1px solid var(--bd2);
  padding-top:.45rem;margin-top:.3rem;font-variant-numeric:tabular-nums;
}
.ta-foot.over{color:var(--err);}

/* ─── الأزرار ─── */
.btn-primary{
  width:100%;padding:.85rem 1.5rem;
  background:var(--ac);color:var(--ac-tx);border:1.5px solid var(--ac);border-radius:.7rem;
  font-size:.97rem;font-weight:600;font-family:var(--font);
  cursor:pointer;transition:opacity .14s,transform .08s;
  display:flex;align-items:center;justify-content:center;gap:.5rem;
}
.btn-primary:hover{background:var(--grn-h);border-color:var(--grn-h);}
.btn-primary:active{transform:scale(.985);}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.btn-back{
  display:block;width:100%;padding:.55rem;text-align:center;
  background:none;border:none;color:var(--tx2);
  font-size:.85rem;font-family:var(--font);cursor:pointer;
  margin-top:.55rem;transition:color .14s;
}
.btn-back:hover{color:var(--tx);}
.btn-back:disabled{opacity:.35;cursor:not-allowed;}
.btn-back.hidden{visibility:hidden;pointer-events:none;}
.btn-ghost{
  width:100%;padding:.75rem;background:none;color:var(--tx);
  border:1.5px solid var(--bd);border-radius:.7rem;
  font-size:.9rem;font-weight:600;font-family:var(--font);cursor:pointer;margin-top:.55rem;
}

.err-msg{font-size:.76rem;color:var(--err);margin-bottom:.75rem;display:none;padding-right:.1rem;line-height:1.5;}
.err-msg.on{display:block;}

/* ─── مؤشر التحميل ─── */
.spin{
  width:.9375rem;height:.9375rem;border:2px solid currentColor;border-top-color:transparent;
  border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ─── المراجعة ─── */
.rev-group{margin-bottom:1.3rem;}
.rev-h{
  font-size:.72rem;font-weight:700;color:var(--tx);
  padding-bottom:.4rem;border-bottom:1.5px solid var(--grn);margin-bottom:.15rem;
}
.rev-row{
  display:flex;justify-content:space-between;align-items:baseline;gap:1rem;
  font-size:.82rem;padding:.42rem 0;border-bottom:1px solid var(--bd2);
}
.rev-k{color:var(--tx2);flex-shrink:0;}
.rev-v{font-weight:600;color:var(--tx);font-variant-numeric:tabular-nums;text-align:left;}
.rev-v.txt{font-weight:400;font-size:.78rem;line-height:1.5;}
.rev-edit{
  background:none;border:none;color:var(--tx2);font-size:.7rem;font-family:var(--font);
  cursor:pointer;text-decoration:underline;padding:0;flex-shrink:0;
}
.rev-edit:hover{color:var(--tx);}

/* ─── تم ─── */
.done-wrap{text-align:center;padding:1rem 0;}
.done-mark{
  width:4.125rem;height:4.125rem;border-radius:50%;background:var(--ring);
  display:flex;align-items:center;justify-content:center;margin:0 auto 1.4rem;
}
.done-mark svg path{stroke:var(--grn);}
.done-title{font-size:1.7rem;font-weight:700;letter-spacing:-.02em;color:var(--tx);margin-bottom:.4rem;}
.done-sub{font-size:.9rem;color:var(--tx2);line-height:1.65;margin-bottom:1.4rem;}
.ref-box{
  border:1.5px solid var(--grn);border-radius:.7rem;padding:.8rem 1rem;
  font-size:.78rem;color:var(--tx2);text-align:center;
}
.ref-box b{display:block;font-size:1rem;color:var(--grn);font-weight:700;
  font-variant-numeric:tabular-nums;letter-spacing:.04em;margin-top:.2rem;direction:ltr;}
.done-note{font-size:.72rem;color:var(--tx3);line-height:1.6;margin-top:.55rem;}
.sent-log{
  border:1.5px solid var(--bd);border-radius:.7rem;padding:.75rem .9rem;
  margin-top:.9rem;text-align:start;
}
.sent-log-h{display:block;font-size:.72rem;color:var(--tx3);margin-bottom:.45rem;}
.sent-log-row{
  display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  font-size:.76rem;color:var(--tx2);padding:.28rem 0;border-top:1px solid var(--bd);
}
.sent-log-row:first-of-type{border-top:none;}
.sent-log-row b{
  color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums;
  letter-spacing:.03em;direction:ltr;flex:none;
}
.sent-log-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ─── استئناف ─── */
.resume-box{
  border:1.5px solid var(--bd);border-radius:.7rem;padding:1rem;
  margin-bottom:1.3rem;font-size:.85rem;color:var(--tx2);line-height:1.6;
}
.resume-box b{color:var(--tx);}

/* ─── شاشة البند الكامل: كل أقسام البند في صفحة واحدة ─── */
.item-title{margin-bottom:1.9rem;}
.sec-grid{display:grid;grid-template-columns:1fr;gap:1.9rem;margin-bottom:2rem;}
.sec{display:flex;flex-direction:column;}
.sec-h{
  display:flex;align-items:center;gap:.6rem;
  padding-bottom:.5rem;border-bottom:1px solid var(--bdi);margin-bottom:.55rem;
}
.sec-n{
  width:1.2rem;height:1.2rem;border-radius:.3rem;flex-shrink:0;
  background:var(--ac);color:var(--ac-tx);
  font-size:.68rem;font-weight:700;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;justify-content:center;
}
.sec-t{font-size:.95rem;font-weight:700;color:var(--tx);letter-spacing:-.012em;line-height:1.3;}
.sec-d{font-size:.73rem;color:var(--tx3);line-height:1.5;margin-bottom:.75rem;}
.sec .yr-list{margin-bottom:0;gap:.4rem;}
.sec .yb + .yb{margin-top:.15rem;}
.sec .num-field{margin-bottom:0;}
.sec .err-msg{margin:.6rem 0 0;}
.s-spec .ta-wrap{flex:1;display:flex;flex-direction:column;margin-bottom:0;}
.s-spec .ta{flex:1;min-height:5rem;}
.t-body{display:contents;}   /* بلا صندوق — الحقل يحاذي أعلى القسم المجاور */
.t-note{font-size:.72rem;color:var(--tx3);line-height:1.5;margin-top:.55rem;}

.item-actions{display:flex;flex-direction:column;}

@media(min-width:820px){
  .sec-grid{grid-template-columns:1fr 1fr;column-gap:3rem;row-gap:2.1rem;}
  .item-actions{flex-direction:row-reverse;justify-content:flex-start;align-items:center;gap:1.1rem;}
  .item-actions .btn-primary{width:auto;min-width:13.5rem;}
  .item-actions .btn-back{width:auto;margin-top:0;padding:.55rem .5rem;}
}

/* ─── تجاوب ─── */
@media(max-width:500px){
  .topbar{padding:1.1rem 1.25rem 0;}
  .logo{height:2.1rem;}
  .bar-right{gap:.6rem;}
  .step-lbl{font-size:.64rem;}
  .saved{font-size:.62rem;}
  .content{padding:1.4rem 1.1rem 1.25rem;}
  .yb-yr{min-width:3.4rem;padding:.5rem .45rem;}
  .yb-yr b{font-size:.92rem;}
  .pr{grid-template-columns:minmax(0,1fr) minmax(4.6rem,6rem);gap:.5rem;padding:.5rem .6rem;}
  .pr-lbl{font-size:.74rem;}
  .scr-title{font-size:1.5rem;}
  .step-lbl{font-size:.65rem;}
}
@media(min-width:900px){
  .topbar{padding:1.75rem 0 0;}
  /* في الوضع العريض: نفس هوامش المحتوى تماماً ليتحاذى الشعار مع الشبكة */
  body.wide .topbar{max-width:57rem;padding-inline:1.5rem;}
  .content{padding:2.5rem 1.5rem 2rem;}
}
/* الدسكتوب: نكبّر المقياس كله بدل أن يزوّم المستخدم يدوياً */
@media(min-width:1024px){ html{font-size:18px;} }
@media(min-width:1400px){ html{font-size:20px;} }
@media(prefers-reduced-motion:reduce){
  .screen,.pfill{transition-duration:.01ms!important;}
  .spin{animation-duration:1.4s;}
}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-5px);}
  40%{transform:translateX(5px);}
  60%{transform:translateX(-3px);}
  80%{transform:translateX(3px);}
}
</style>
</head>

/* ═══════════ رقم مرجعي فريد للاستجابة ═══════════ */
function makeRef(){
  try{
    const a = new Uint8Array(4);
    window.crypto.getRandomValues(a);
    return 'YM-' + Array.prototype.map.call(a, function(b){
      return ('0' + b.toString(16)).slice(-2);
    }).join('').toUpperCase();
  }catch(e){
    return 'YM-' + String(Date.now()).slice(-8);
  }
}
if(!D._ref) D._ref = makeRef();

/* ═══════════ سجل الاستجابات المُرسلة من هذا الجهاز ═══════════
   مفتاح مستقل عن STORE_KEY حتى تبقى الأرقام المرجعية بعد مسح
   الاستبيان الحالي للبدء باستبيان جديد. */
const SENT_KEY = 'yamur_sent_v1';
function readSent(){
  try{
    const a = JSON.parse(localStorage.getItem(SENT_KEY) || '[]');
    return Array.isArray(a) ? a : [];
  }catch(e){ return []; }
}
function recordSent(){
  try{
    const a = readSent().filter(function(r){ return r && r.ref !== D._ref; });
    a.push({
      ref:  D._ref,
      name: cleanText(D.name || '', 120).trim(),
      at:   new Date().toISOString()
    });
    localStorage.setItem(SENT_KEY, JSON.stringify(a.slice(-50)));
  }catch(e){ /* التخزين ممتلئ أو محظور — لا يمنع ذلك الإرسال */ }
}

function $(id){ return document.getElementById(id); }
/* البحث داخل الشاشة النشطة — أثناء الانتقال توجد شاشتان في DOM */
function $a(id){

  const sc = st ? st.querySelector('.screen.active') : null;

function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }

/* تحويل الأرقام العربية والفارسية إلى لاتينية */
const RE_ARDIG = new RegExp('[\\u0660-\\u0669\\u06F0-\\u06F9]', 'g');
function normDigits(s){
  return String(s==null?'':s).replace(RE_ARDIG, function(ch){
    const c = ch.charCodeAt(0);
    return String(c >= 0x06F0 ? c - 0x06F0 : c - 0x0660);
  });
}

/* تنقية مُدخل رقمي: أرقام فقط + فاصلة عشرية واحدة، بدون إشارات أو رموز */
const RE_ARDEC = new RegExp('[\\u066B\\u066C]', 'g');
const RE_SEPS  = new RegExp('[,\\s\\u060C]', 'g');
function cleanNum(raw){
  let s = normDigits(raw)
    .replace(RE_ARDEC, '.')       /* الفاصلة العشرية العربية */
    .replace(RE_SEPS, '')         /* فواصل الآلاف والمسافات */
    .replace(/[^0-9.]/g, '');     /* حذف كل ما ليس رقماً أو نقطة */
  const p = s.split('.');
  s = p.shift().slice(0, CONFIG.MAX_NUM_DIGITS);
  if(p.length) s += '.' + p.join('').replace(/[^0-9]/g,'').slice(0,2);
  return s;
}
/* تحويل نص رقمي منقّى إلى رقم صالح أو null */
function toNum(raw){
  const s = cleanNum(raw).replace(/\.$/,'');
  if(s === '' || s === '.') return null;
  const n = Number(s);
  return (isFinite(n) && n >= 0) ? n : null;
}
function hasVal(v){ return toNum(v) !== null; }

/* تنقية نص حر: حذف محارف التحكّم ومحارف اتجاه النص — منع التلاعب والحقن */
const RE_CTRL = new RegExp('[\\u0000-\\u0008\\u000B\\u000C\\u000E-\\u001F\\u007F]', 'g');
const RE_BIDI = new RegExp('[\\u200B-\\u200F\\u202A-\\u202E\\u2060-\\u2064\\u2066-\\u2069\\uFEFF]', 'g');
function cleanText(raw, max){
  return String(raw==null?'':raw)
    .replace(RE_CTRL, '')
    .replace(RE_BIDI, '')
    .replace(/[ \t]{4,}/g, '   ')
    .slice(0, max || CONFIG.MAX_TEXT);
}
/* منع تنفيذ الصيغ داخل Google Sheets أو Excel */
function safeCell(v){
  if(typeof v !== 'string') return v;
  return /^[=+\-@\t\r]/.test(v) ? "'" + v : v;
}

function fmt(n){
  return (n===null||n===undefined||n==='') ? '—' : Number(n).toLocaleString('en-US');
}
/* ═══════════ التحقّق من الحقول التعريفية ═══════════ */
const RE_LETTER = new RegExp('[\\u0621-\\u064AA-Za-z]');
function vName(v){
  const s = cleanText(v,120).trim().replace(/\s{2,}/g,' ');
  if(s.length < 3) return { ok:false, msg:'اكتب اسم الجمعية كاملاً — 3 أحرف على الأقل.' };
  if(!RE_LETTER.test(s)) return { ok:false, msg:'اسم الجمعية غير صحيح.' };
  return { ok:true, val:s };
}
function vEmail(v){
  const s = cleanText(v,100).trim();
  if(!/^[A-Za-z0-9._%+-]{1,64}@[A-Za-z0-9][A-Za-z0-9.-]{0,62}\.[A-Za-z]{2,12}$/.test(s))
    return { ok:false, msg:'صيغة البريد الإلكتروني غير صحيحة. مثال: info@assoc.org.sa' };
  return { ok:true, val:s.toLowerCase() };
}
function vTel(v){
  let s = normDigits(v).replace(/\D/g,'');
  if(/^00966\d{9}$/.test(s))      s = '0' + s.slice(5);
  else if(/^966\d{9}$/.test(s))   s = '0' + s.slice(3);
  if(!/^05\d{8}$/.test(s))
    return { ok:false, msg:'رقم الجوال يجب أن يكون 10 أرقام ويبدأ بـ 05. مثال: 0551234567' };
  return { ok:true, val:s };
}

function revTgt(it, keys){
  if(!it.parts)
    return `<div class="rev-row"><span class="rev-k">مستهدف 2026</span>
      <span class="rev-v">${fmt(toNum(D[keys[0]]))} ${esc(it.unit)}</span></div>`;
  return it.parts.map(function(pt,j){
    return `<div class="rev-row"><span class="rev-k">مستهدف 2026 — ${esc(pt.name)}</span>
      <span class="rev-v">${fmt(toNum(D[keys[j]]))} ${esc(pt.unit)}</span></div>`;
  }).join('');
}

function renderReview(){

    <div class="rev-group">
      <div class="rev-h">بيانات الجمعية</div>

      <div class="rev-row"><span class="rev-k">البريد</span><span class="rev-v" dir="ltr">${esc(D.email||'—')}</span></div>
      <div class="rev-row"><span class="rev-k">الجوال</span><span class="rev-v" dir="ltr">${esc(D.tel||'—')}</span></div>
      <div class="rev-row" style="border-bottom:none"><span class="rev-k">الرقم المرجعي</span><span class="rev-v" dir="ltr">${esc(D._ref)}</span></div>
    </div>`;

  ITEMS.forEach(function(it,ii){

  ${html}
  <div class="err-msg" id="err-send"></div>

  <button class="btn-back" style="font-size:.72rem;color:var(--tx3)" onclick="resetAll()">مسح الإجابات والبدء من جديد</button>`;
}

function renderDone(){
  /* الاستجابات السابقة من الجهاز نفسه — تُعرض حتى لا تُفقد أرقامها
     المرجعية عند البدء باستبيان جديد. */
  const prev = readSent().filter(function(r){ return r && r.ref && r.ref !== D._ref; });
  let log = '';
  if(prev.length){
    log = '<div class="sent-log"><span class="sent-log-h">استجابات سابقة أُرسلت من هذا الجهاز ('
        + prev.length + ')</span>'
        + prev.slice().reverse().map(function(r){
            return '<div class="sent-log-row"><span>' + esc(r.name || '—') + '</span><b>'
                 + esc(r.ref) + '</b></div>';
          }).join('')
        + '</div>';
  }

  return `
  <div class="done-wrap">
    <div class="done-mark">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path d="M5 16L12.5 23.5L27 8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 class="done-title">تم الإرسال والحفظ</h1>
    <p class="done-sub">
      شكراً لتعاونكم

    <div class="ref-box">الرقم المرجعي لاستجابتكم<b>${esc(D._ref)}</b></div>

function render(q){
  let h = '';
  if(q.type==='terms')  h = renderTerms();
  if(q.type==='info')   h = renderInfo();
  if(q.type==='item')   h = renderItem(q);
  if(q.type==='review') h = renderReview();
  if(q.type==='done')   h = renderDone();
  return '<div class="' + (q.type==='item' ? 'wide' : '') + '">' + h + '</div>';
}

/* ═══════════ معالجات الإدخال — تنقية فورية ═══════════ */
function onNum(key, el){
  const clean = cleanNum(el.value);
  if(el.value !== clean){
    const atEnd = el.selectionStart === el.value.length;
    el.value = clean;
    if(atEnd){ try{ el.setSelectionRange(clean.length, clean.length); }catch(e){} }
  }
  D[key] = clean;
  hideErr();
  autosave();
}

function onText(key, el){
  const clean = cleanText(el.value, CONFIG.MAX_TEXT);
  if(el.value !== clean) el.value = clean;
  D[key] = clean;
  const c = $a('tacount');
  if(c) c.textContent = clean.length + ' / ' + CONFIG.MAX_TEXT;
  const f = $a('tafoot');
  if(f) f.classList.toggle('over', clean.length >= CONFIG.MAX_TEXT);
  hideErr();
  autosave();
}

/* حقل نصي من سطر واحد بلا عدّاد — الموردون والمقاولون */
function onLine(key, el, max){
  const clean = cleanText(el.value, max || CONFIG.MAX_TEXT);
  if(el.value !== clean) el.value = clean;
  D[key] = clean;
  hideErr();
  autosave();
}

function onInfo(key, el){
  const clean = (key === 'tel')
    ? normDigits(el.value).replace(/[^0-9+]/g,'')
    : cleanText(el.value, 120);
  if(el.value !== clean) el.value = clean;
  D[key] = clean;
  el.classList.remove('bad');
  const n = $('n-'+key); if(n) n.classList.remove('on');
  hideErr();
  autosave();
}
function onInfoBlur(key, el){
  const raw = (D[key]||'').trim();
  if(!raw) return;
  const r = INFO_V[key](raw);
  const n = $('n-'+key);
  if(r.ok){
    D[key] = r.val; el.value = r.val;
    el.classList.remove('bad');
    if(n) n.classList.remove('on');
    persist(true);
  }else{
    el.classList.add('bad');
    if(n){ n.textContent = r.msg; n.classList.add('on'); }
  }
}

/* ═══════════ التحقّق قبل التقدّم ═══════════ */
function validate(q){
  if(q.type === 'terms') return D.agreed ? null : 'err-terms';

  if(q.type === 'info'){
    let bad = null;
    ['name','email','tel'].forEach(function(k){
      const r  = INFO_V[k]((D[k]||'').trim());
      const el = $('f-'+k), n = $('n-'+k);
      if(!r.ok){
        if(!bad) bad = k;
        if(el) el.classList.add('bad');
        if(n){ n.textContent = r.msg; n.classList.add('on'); }
      }else{
        D[k] = r.val;
        if(el){ el.value = r.val; el.classList.remove('bad'); }
        if(n) n.classList.remove('on');
      }
    });
    if(bad){ const el = $('f-'+bad); if(el) el.focus(); return 'err-info'; }
    persist(true);
    return null;
  }

  if(q.type === 'item') return validateItem(q);

  return null;
}

/* يفحص مجموعة حقول رقمية ويؤشّر على الناقص منها — يعيد أول حقل ناقص */
function markNums(keys, errId){
  let firstBad = null;
  keys.forEach(function(k){
    const ok = hasVal(D[k]);
    const w  = $a('w-'+k);
    if(w) w.classList.toggle('bad', !ok);
    if(!ok && !firstBad) firstBad = $a('in-'+k);
  });
  const bad = keys.some(function(k){ return !hasVal(D[k]); });
  const e = $a(errId);
  if(e) e.classList.toggle('on', bad);
  return bad ? { err:errId, el:firstBad } : null;
}

/* التحقّق من البند كاملاً — يؤشّر على كل قسم ناقص ويعيد أوّلها */
function validateItem(q){
  const probs = [];

  const p1 = markNums(q.k1, 'err-qty');   if(p1) probs.push(p1);
  const p2 = markNums(q.k3, 'err-cost');  if(p2) probs.push(p2);

  const okSupp = cleanText(D[q.k5]||'', CONFIG.MAX_SUPP).trim().length >= 2;
  const wp = $a('w-supp');   if(wp) wp.classList.toggle('bad', !okSupp);
  const ep = $a('err-supp'); if(ep) ep.classList.toggle('on', !okSupp);
  if(!okSupp) probs.push({ err:'err-supp', el:$a('in-supp') });

  const okSpec = cleanText(D[q.k2]||'', CONFIG.MAX_TEXT).trim().length >= 2;
  const ws = $a('w-spec');   if(ws) ws.classList.toggle('bad', !okSpec);
  const es = $a('err-spec'); if(es) es.classList.toggle('on', !okSpec);
  if(!okSpec) probs.push({ err:'err-spec', el:$a('ta') });

  const p4 = markNums(q.k4, 'err-target'); if(p4) probs.push(p4);

  if(!probs.length) return null;

  const first = probs[0];
  if(first.el){
    try{ first.el.scrollIntoView({ block:'center', behavior:'smooth' }); }catch(e){}
    try{ first.el.focus({ preventScroll:true }); }catch(e){ first.el.focus(); }
  }
  return first.err;
}

function showErr(id){
  const el = $a(id);
  if(el) el.classList.add('on');
  const stage = $('stage');
  stage.style.animation = 'none';
  void stage.offsetHeight;
  stage.style.animation = 'shake .32s ease';
}
function hideErr(){
  const stage = $('stage');
  if(!stage) return;
  const list = stage.querySelectorAll('.err-msg.on');
  for(let i=0;i<list.length;i++) list[i].classList.remove('on');
  const bads = stage.querySelectorAll('.yr-item.bad,.num-field.bad,.ta-wrap.bad,.pr-in.bad,.sup-wrap.bad');
  for(let j=0;j<bads.length;j++) bads[j].classList.remove('bad');
}

/* ═══════════ التنقّل ═══════════ */
function next(){
  if(sending) return;
  const q = SCREENS[idx];
  if(q.type === 'review'){ submitAll(); return; }
  if(q.type === 'done') return;
  const e = validate(q);
  if(e){ showErr(e); return; }
  persist(true);
  doNavigate(1);
}
function prev(){ if(!sending) doNavigate(-1); }

function jumpTo(target){
  if(sending) return;
  if(target < 0 || target >= SCREENS.length) return;
  doNavigate(target - idx);
}

function doNavigate(dir){
  const ni = idx + dir;
  if(ni < 0 || ni >= SCREENS.length) return;

  const stage = $('stage');
  const olds  = Array.prototype.slice.call(stage.children);
  olds.forEach(function(o){ o.classList.remove('active','entering'); o.classList.add('exiting'); });
  const old = olds[olds.length-1] || null;

  idx = ni;
  const tmp = document.createElement('div');
  tmp.innerHTML = render(SCREENS[idx]);
  const newEl = tmp.firstElementChild;
  newEl.classList.add('screen','entering');
  stage.appendChild(newEl);

  const wrap = stage.parentElement;
  if(old) wrap.style.minHeight = old.offsetHeight + 'px';

  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    newEl.classList.remove('entering');
    newEl.classList.add('active');
    setTimeout(function(){
      olds.forEach(function(o){ if(o.parentNode === stage) stage.removeChild(o); });
      wrap.style.minHeight = '';
      focusFirst();
    }, 300);
  }); });

  updateChrome();
  persist(true);
  try{ window.scrollTo({ top:0, behavior:'smooth' }); }catch(e){ window.scrollTo(0,0); }
}

function focusFirst(){
  const q = SCREENS[idx];
  let el = null;
  if(q.type === 'info')      el = $('f-name');
  else if(q.type === 'item') el = itemInputs()[0] || null;
  if(el && window.matchMedia('(min-width:700px)').matches) el.focus();
}

/* حقول البند الرقمية بالترتيب — للتنقّل بمفتاح Enter */
function itemInputs(){
  const st = $('stage');
  const sc = st ? st.querySelector('.screen.active') : null;
  return sc ? Array.prototype.slice.call(sc.querySelectorAll('.it-inp')) : [];
}

function updateChrome(){
  $('pfill').style.width = (idx / (SCREENS.length-1) * 100) + '%';
  const q = SCREENS[idx];
  let lbl = '';
  if(q.type === 'info')        lbl = 'التجهيز';
  else if(q.type === 'review') lbl = 'مراجعة';
  else if(q.type === 'done')   lbl = 'مكتمل';
  else if(q.type === 'item')   lbl = 'بند ' + (q.ii+1) + ' من ' + ITEMS.length;
  $('steplbl').textContent = lbl;
  document.body.classList.toggle('wide', q.type === 'item');
}

/* ═══════════ الإرسال إلى Google Sheet ═══════════ */
function buildHeaders(){
  const h = ['وقت الإرسال','الرقم المرجعي','اسم الجمعية','البريد الإلكتروني','رقم الجوال'];
  ITEMS.forEach(function(it){
    /* اسم العمود: البند [- المكوّن] - منجز/تكلفة السنة (الوحدة) */
    function cols(lbl, unit){
      YEARS.forEach(function(y){
        if(!it.parts){ h.push(it.name + ' - ' + lbl + ' ' + y + ' (' + (unit || it.unit) + ')'); return; }
        it.parts.forEach(function(pt){
          h.push(it.name + ' - ' + pt.name + ' - ' + lbl + ' ' + y + ' (' + (unit || pt.unit) + ')');
        });
      });
    }
    cols('منجز', '');
    h.push(it.name + ' - المواصفات المعتمدة');
    cols('تكلفة', 'ريال');
    if(!it.parts) h.push(it.name + ' - مستهدف 2026 (' + it.unit + ')');
    else it.parts.forEach(function(pt){
      h.push(it.name + ' - ' + pt.name + ' - مستهدف 2026 (' + pt.unit + ')');
    });
  });
  /* أعمدة الموردين تُضاف في آخر الجدول لا داخل كتلة كل بند: سكربت الشيت
     يُلحق الأعمدة الجديدة في النهاية فقط، فلو أُقحمت في المنتصف لانزاحت
     أعمدة الاستجابات المحفوظة سابقاً عن عناوينها. */
  ITEMS.forEach(function(it){ h.push(it.name + ' - ' + SUPP.col); });
  return h;
}

function buildValues(){
  const v = [
    '',                                    /* وقت الإرسال — يُملأ في الخادم */
    D._ref,
    safeCell(cleanText(D.name||'',120).trim()),
    safeCell(cleanText(D.email||'',100).trim()),
    "'" + (D.tel || '')                    /* كنص للحفاظ على الصفر في البداية */
  ];
  ITEMS.forEach(function(it){
    flat(yrKeys(it,'q1')).forEach(function(k){ v.push(toNum(D[k])); });
    v.push(safeCell(cleanText(D[K(it,'q2')]||'', CONFIG.MAX_TEXT).trim()));
    flat(yrKeys(it,'q3')).forEach(function(k){ v.push(toNum(D[k])); });
    tgtKeys(it).forEach(function(k){ v.push(toNum(D[k])); });
  });
  /* بنفس ترتيب buildHeaders — الموردون في آخر الأعمدة */
  ITEMS.forEach(function(it){
    v.push(safeCell(cleanText(D[K(it,'q5')]||'', CONFIG.MAX_SUPP).trim()));
  });
  return v;
}

/* فحص شامل نهائي — لا نرسل بيانات ناقصة أو غير صالحة */
function finalCheck(){
  const problems = [];
  ['name','email','tel'].forEach(function(k){
    if(!INFO_V[k]((D[k]||'').trim()).ok && problems.indexOf('بيانات الجمعية') === -1)
      problems.push('بيانات الجمعية');
  });
  ITEMS.forEach(function(it,ii){
    let miss = false;
    flat(yrKeys(it,'q1')).forEach(function(k){ if(!hasVal(D[k])) miss = true; });
    flat(yrKeys(it,'q3')).forEach(function(k){ if(!hasVal(D[k])) miss = true; });
    tgtKeys(it).forEach(function(k){ if(!hasVal(D[k])) miss = true; });
    if(cleanText(D[K(it,'q2')]||'', CONFIG.MAX_TEXT).trim().length < 2) miss = true;
    if(cleanText(D[K(it,'q5')]||'', CONFIG.MAX_SUPP).trim().length < 2) miss = true;
    if(miss) problems.push('البند ' + (ii+1) + ' — ' + it.name);
  });
  return problems;
}

function postJSON(url, obj, ms){
  const ctl   = new AbortController();
  const timer = setTimeout(function(){ ctl.abort(); }, ms);
  /* نوع المحتوى text/plain يجعل الطلب "بسيطاً" فلا يحتاج preflight من CORS */
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(obj),
    redirect: 'follow',
    signal: ctl.signal
  }).then(function(res){
    clearTimeout(timer);
    return res.text().then(function(txt){
      if(!res.ok) throw new Error('رفض الخادم الطلب (HTTP ' + res.status + ').');
      let data;
      try{ data = JSON.parse(txt); }
      catch(e){ throw new Error('رد غير مفهوم من الخادم — تأكّد من رابط النشر وأن صلاحية الوصول "لأي شخص".'); }
      return data;
    });
  }, function(err){
    clearTimeout(timer);
    if(err && err.name === 'AbortError') throw new Error('انتهت مدة الانتظار. تحقّق من الاتصال بالإنترنت.');
    throw new Error('تعذّر الوصول إلى الخادم. تحقّق من الاتصال بالإنترنت ثم أعد المحاولة.');
  });
}

function setSending(on, txt){
  sending = on;
  const b = $('btn-send'), bk = $('btn-back-rev');
  if(b){
    b.disabled = on;
    b.innerHTML = on ? '<span class="spin"></span> ' + (txt || 'جارٍ الحفظ…') : 'إرسال الاستبيان';
  }
  if(bk) bk.disabled = on;
  const eds = document.querySelectorAll('.rev-edit');
  for(let i=0;i<eds.length;i++) eds[i].disabled = on;
}

function sendErr(msg){
  const e = $('err-send');
  if(e){ e.innerHTML = msg; e.classList.add('on'); }
}

function submitAll(){
  if(sending) return;
  hideErr();

  const problems = finalCheck();
  if(problems.length){
    const uniq = problems.filter(function(v,i,a){ return a.indexOf(v) === i; });
    sendErr('لا يمكن الإرسال — توجد إجابات ناقصة أو غير صالحة في: ' + esc(uniq.join('، ')) + '. أكملها ثم أعد المحاولة.');
    showErr('err-send');
    return;
  }

  if(!CONFIG.SCRIPT_URL || CONFIG.SCRIPT_URL.indexOf('/exec') === -1){
    sendErr('الربط بجدول البيانات غير مُهيَّأ بعد (SCRIPT_URL فارغ). <b>لم تُرسل البيانات</b> — إجاباتك محفوظة على جهازك ولن تُفقد.');
    showErr('err-send');
    return;
  }

  const payload = {
    secret:  CONFIG.SECRET,
    ref:     D._ref,
    headers: buildHeaders(),
    values:  buildValues()
  };

  setSending(true);
  let lastErr = 'تعذّر الحفظ.';
  let attempt = 0;

  function attemptSend(){
    attempt++;
    if(attempt > 1) setSending(true, 'إعادة المحاولة ' + attempt + ' من 3…');
    return postJSON(CONFIG.SCRIPT_URL, payload, 30000).then(function(res){
      if(res && res.ok === true){
        if(res.backup === false && window.console)
          console.warn('تم الحفظ في الجدول، لكن النسخة الاحتياطية فشلت:', res.backupWarning);
        recordSent();
        D.submitted = true;
        D.row = res.row || '';
        persist(true);
        setSending(false);
        doNavigate(DONE_IDX - idx);
        return true;                                  /* نجاح مؤكَّد من الخادم */
      }
      lastErr = (res && res.error) ? String(res.error) : 'رد غير متوقع من الخادم.';
      if(res && res.fatal === true) return false;      /* خطأ لا تُفيد إعادة المحاولة معه */
      return retry();
    }, function(err){
      lastErr = (err && err.message) ? err.message : String(err);
      return retry();
    });
  }

  function retry(){
    if(attempt >= 3) return false;
    return sleep(1200 * attempt).then(attemptSend);
  }

  attemptSend().then(function(okDone){
    if(okDone) return;
    setSending(false);
    sendErr(esc(lastErr) + '<br>إجاباتك محفوظة على جهازك ولم تُفقد — اضغط «إرسال الاستبيان» للمحاولة مرة أخرى.');
    showErr('err-send');
  });
}

/* ═══════════ استرجاع طارئ — بلا واجهة ولا زر ═══════════
   المستخدم لا يرى هذا إطلاقاً. يُستخدم فقط إن تعذّر وصول استجابة
   إلى الخادم وأردنا استخراجها من جهاز الجمعية: افتح Console
   في متصفحها ثم اكتب  downloadBackup()  */
function buildBackupObject(){
  const h = buildHeaders(), v = buildValues();
  const answers = {};
  h.forEach(function(k,i){
    let x = v[i];
    if(i === 0) x = D._at || '';                                  /* وقت آخر حفظ محلي */
    if(typeof x === 'string' && x.charAt(0) === "'") x = x.substring(1);
    answers[k] = x;
  });
  return {
    ref: D._ref,
    generatedAt: new Date().toISOString(),
    submittedToServer: !!D.submitted,
    sheetRow: D.row || null,
    answers: answers
  };
}

function downloadBackup(){
  try{
    const txt  = JSON.stringify(buildBackupObject(), null, 2);
    const blob = new Blob([txt], { type:'application/json;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = 'yamur-' + (D._ref || 'response') + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      if(a.parentNode) a.parentNode.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1500);
    flashSaved('تم تنزيل النسخة');
  }catch(e){
    alert('تعذّر تنزيل النسخة على هذا المتصفح.');
  }
}

/* ═══════════ متفرّقات ═══════════ */
function toggleAgree(){
  D.agreed = !D.agreed;
  persist(true);
  const c = $('chk');
  if(c) c.classList.toggle('on', !!D.agreed);
  if(D.agreed) hideErr();
}

function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const nxt = (cur === 'dark') ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', nxt);
  try{ localStorage.setItem('yamur_theme', nxt); }catch(e){}
}

/* Enter للمتابعة — ما عدا داخل حقل نصي متعدد الأسطر */
document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter' || e.shiftKey) return;
  const t = e.target;
  if(t && (t.tagName === 'TEXTAREA' || t.tagName === 'BUTTON')) return;
  e.preventDefault();
  /* داخل شاشة البند: Enter ينقل إلى الحقل التالي، وفي آخر حقل ينتقل للبند التالي */
  if(SCREENS[idx] && SCREENS[idx].type === 'item' && t && t.tagName === 'INPUT'){
    const list = itemInputs();
    const i = list.indexOf(t);
    if(i > -1 && i < list.length - 1){ list[i+1].focus(); return; }
  }
  next();
});

/* حفظ فوري عند مغادرة الصفحة أو تصغيرها */
window.addEventListener('beforeunload', function(){ clearTimeout(saveTimer); persist(true); });
document.addEventListener('visibilitychange', function(){
  if(document.hidden){ clearTimeout(saveTimer); persist(true); }
});

/* ═══════════ التشغيل والاستئناف التلقائي ═══════════ */
(function boot(){
  let theme = 'light';
  try{ theme = localStorage.getItem('yamur_theme') || 'light'; }catch(e){}
  document.documentElement.setAttribute('data-theme', theme);

  /* ترحيل: كان لكل بند 4 شاشات، والآن شاشة واحدة — نُعيد حساب موضع الاستئناف */
  if(D._sv !== SCREEN_VER){
    const old = parseInt(D._idx, 10);
    if(isFinite(old) && old >= FIRST_Q){
      const oi = old - FIRST_Q;
      D._idx = (oi >= ITEMS.length * 4)
        ? FIRST_Q + ITEMS.length                       /* المراجعة */
        : FIRST_Q + Math.floor(oi / 4);                /* البند نفسه */
    }
    D._sv = SCREEN_VER;
  }

  let resumed = false;
  if(D.submitted){
    idx = DONE_IDX;
  }else{
    const saved = parseInt(D._idx, 10);
    if(isFinite(saved) && saved > 0 && saved < DONE_IDX){
      idx = saved;
      resumed = true;
    }
  }

  const stage   = $('stage');
  const wrapEl  = document.createElement('div');
  wrapEl.innerHTML = render(SCREENS[idx]);
  const sc = wrapEl.firstElementChild;
  sc.classList.add('screen','active');
  stage.appendChild(sc);
  updateChrome();
  focusFirst();

  if(resumed){
    flashSaved('تم استعادة إجاباتك');
    const el = $('savedlbl');
    if(el){
      clearTimeout(savedTimer);
      savedTimer = setTimeout(function(){ el.classList.remove('on'); }, 4500);
    }
  }
})();
</script>
