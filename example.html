<title>استبيان بيانات الخدمات — يعمر</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #FFFFFF;
  --sf:      #F7F7F5;
  --tx:      #0A0A0A;
  --tx2:     #404040;
  --tx3:     #888888;
  --bd:      #111111;
  --grn:     #005B36;
  --grn-h:   #007249;
  --ov:      #9DB35A;
  --inp:     #FFFFFF;
  --err:     #CC2200;
  --font: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', 'Geeza Pro', Arial, sans-serif;
}

:root[data-theme=dark]{--bg:#000000;--sf:#111111;--tx:#FFFFFF;--tx2:#BBBBBB;--tx3:#666666;--bd:#FFFFFF;--inp:#000000;}
:root[data-theme=light]{--bg:#FFFFFF;--sf:#F7F7F5;--tx:#0A0A0A;--tx2:#404040;--tx3:#888888;--bd:#111111;--inp:#FFFFFF;}

html,body{
  min-height:100vh;background:var(--bg);color:var(--tx);
  font-family:var(--font);direction:rtl;-webkit-font-smoothing:antialiased;
  font-size:16px;line-height:1.5;
}

/* ─── thin progress strip ─── */
.pline{position:fixed;top:0;left:0;right:0;height:3px;background:var(--sf);z-index:200;border-bottom:1px solid rgba(0,0,0,.08);}
.pfill{height:100%;background:var(--grn);transition:width .55s cubic-bezier(.65,0,.35,1);}

/* ─── shell ─── */
.shell{min-height:100vh;display:flex;flex-direction:column;padding-top:2px;}

/* ─── topbar ─── */
.topbar{
  padding:1.4rem 2rem 0;
  display:flex;align-items:center;justify-content:space-between;
  max-width:500px;width:100%;margin:0 auto;
}
.logo{height:26px;width:auto;display:block;}
.step-lbl{font-size:.7rem;color:var(--tx3);letter-spacing:.05em;font-variant-numeric:tabular-nums;}

/* ─── content ─── */
.content{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:2rem 1.5rem 1.5rem;
}
.stage-wrap{
  width:100%;max-width:440px;
  position:relative;min-height:1px;
}

/* ─── screen transition ─── */
.screen{
  width:100%;
  transition:opacity .28s ease, transform .28s ease;
}
.screen.entering{opacity:0;transform:translateY(14px);}
.screen.active{opacity:1;transform:translateY(0);}
.screen.exiting{
  position:absolute;top:0;left:0;right:0;
  opacity:0;transform:translateY(-8px);
  pointer-events:none;z-index:1;
}

/* ─── typography ─── */
.eyebrow{
  font-size:.68rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ov);margin-bottom:.55rem;
}
.scr-title{
  font-size:1.95rem;font-weight:700;letter-spacing:-.025em;
  line-height:1.18;margin-bottom:.5rem;color:var(--tx);
  text-wrap:balance;
}
.scr-sub{font-size:.93rem;color:var(--tx2);line-height:1.6;margin-bottom:1.75rem;}
.qnum-accent{
  font-size:5rem;font-weight:800;letter-spacing:-.04em;line-height:.9;
  color:var(--grn);opacity:.12;font-variant-numeric:tabular-nums;
  margin-bottom:-.8rem;user-select:none;
}

/* ─── terms list ─── */
.terms-card{
  background:var(--sf);border:1.5px solid var(--bd);border-radius:1rem;
  overflow:hidden;margin-bottom:1.5rem;
}
.term-row{
  display:flex;gap:.85rem;align-items:flex-start;
  padding:.85rem 1.1rem;
}
.term-row+.term-row{border-top:1px solid var(--bd);}.term-row:last-child{border-bottom:none;}
.term-icon{
  width:28px;height:28px;border-radius:.5rem;background:rgba(0,91,54,.1);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:.1rem;
}
.term-body{}
.term-title{font-size:.85rem;font-weight:600;color:var(--tx);margin-bottom:.15rem;}
.term-desc{font-size:.78rem;color:var(--tx2);line-height:1.5;}

/* ─── agree row ─── */
.agree{
  display:flex;align-items:flex-start;gap:.75rem;
  margin-bottom:1.5rem;cursor:pointer;
}
.chk{
  width:22px;height:22px;border-radius:.45rem;
  border:2px solid var(--bd);background:var(--inp);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:background .16s,border-color .16s;margin-top:.1rem;cursor:pointer;
}
.chk.on{background:var(--grn);border-color:var(--grn);}
.chk svg{display:none;}
.chk.on svg{display:block;}
.agree-lbl{font-size:.83rem;color:var(--tx2);line-height:1.55;}
.agree-lbl strong{color:var(--tx);}

/* ─── field group ─── */
.fields{display:flex;flex-direction:column;gap:.6rem;margin-bottom:1.6rem;}
.field{display:flex;flex-direction:column;gap:.3rem;}
.field-lbl{font-size:.7rem;font-weight:700;color:var(--tx2);letter-spacing:.04em;padding-right:.15rem;}
.field-inp{
  background:var(--inp);border:1.5px solid var(--bd);border-radius:.75rem;
  padding:.78rem 1rem;font-size:.97rem;color:var(--tx);
  font-family:var(--font);outline:none;width:100%;
  transition:box-shadow .18s,border-color .18s;
}
.field-inp:focus{border-color:var(--grn);box-shadow:0 0 0 3px rgba(0,91,54,.15);}

/* ─── OTP boxes ─── */
.otp-row{display:flex;gap:.6rem;margin:1.5rem 0 .75rem;direction:ltr;}
.otp-inp{
  flex:1;min-width:0;width:100%;height:64px;background:var(--inp);border:1.5px solid var(--bd);border-radius:.75rem;
  font-size:1.75rem;font-weight:700;text-align:center;color:var(--tx);
  font-variant-numeric:tabular-nums;outline:none;font-family:var(--font);
  transition:box-shadow .18s,border-color .18s;
}
.otp-inp:focus{border-color:var(--grn);box-shadow:0 0 0 3px rgba(0,91,54,.15);}
.otp-hint{font-size:.75rem;color:var(--tx3);text-align:center;margin-bottom:1.4rem;}
.otp-demo{
  display:inline-flex;align-items:center;gap:.4rem;
  background:rgba(157,179,90,.12);color:var(--grn);
  font-size:.72rem;font-weight:700;padding:.25rem .65rem;border-radius:.5rem;
}

/* ─── year rows ─── */
.yr-list{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.8rem;}
.yr-item{
  display:grid;grid-template-columns:auto 1px 1fr auto;
  align-items:center;gap:.85rem;
  background:var(--inp);border:1.5px solid var(--bd);border-radius:.75rem;padding:.7rem 1rem;
  transition:box-shadow .18s,border-color .18s;
}
.yr-item:focus-within{border-color:var(--grn);box-shadow:0 0 0 3px rgba(0,91,54,.15);}
.yr-tag{font-size:.78rem;font-weight:700;color:var(--tx2);}
.yr-divider{height:18px;width:1px;background:var(--bd);}
.yr-val{
  background:transparent;border:none;outline:none;
  font-size:1.05rem;font-weight:600;color:var(--tx);
  font-variant-numeric:tabular-nums;text-align:right;
  font-family:var(--font);width:100%;direction:ltr;
}
.yr-val::placeholder{color:var(--tx3);font-weight:400;}
.yr-unit{font-size:.72rem;font-weight:700;color:var(--grn);white-space:nowrap;}
.auto-row{
  display:flex;justify-content:space-between;align-items:center;
  font-size:.78rem;color:var(--tx2);
  background:var(--sf);border-radius:.7rem;padding:.6rem .85rem;margin-bottom:1.2rem;
}
.auto-val{font-weight:700;color:var(--grn);font-variant-numeric:tabular-nums;}

/* ─── number field ─── */
.num-field{
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:.85rem;
  background:var(--inp);border:1.5px solid var(--bd);border-radius:.75rem;padding:.75rem 1rem;
  transition:box-shadow .18s,border-color .18s;margin-bottom:1.6rem;
}
.num-field:focus-within{border-color:var(--grn);box-shadow:0 0 0 3px rgba(0,91,54,.15);}
.num-inp{
  background:transparent;border:none;outline:none;
  font-size:1.3rem;font-weight:700;color:var(--tx);
  font-variant-numeric:tabular-nums;width:100%;
  direction:ltr;text-align:right;font-family:var(--font);
}
.num-inp::placeholder{color:var(--tx3);font-weight:400;font-size:1rem;}
.num-unit{font-size:.78rem;font-weight:700;color:var(--grn);}

/* ─── buttons ─── */
.btn-primary{
  width:100%;padding:.85rem 1.5rem;
  background:var(--grn);color:#fff;border:none;border-radius:.85rem;
  font-size:.97rem;font-weight:600;font-family:var(--font);
  cursor:pointer;letter-spacing:.01em;
  transition:background .14s,transform .08s;
}
.btn-primary:hover{background:var(--grn-h);}
.btn-primary:active{transform:scale(.98);}
.btn-primary:disabled{opacity:.38;cursor:not-allowed;}
.btn-back{
  display:block;width:100%;padding:.55rem;text-align:center;
  background:none;border:none;color:var(--tx2);
  font-size:.85rem;font-family:var(--font);cursor:pointer;
  margin-top:.6rem;transition:color .14s;
}
.btn-back:hover{color:var(--tx);}
.btn-back.hidden{visibility:hidden;pointer-events:none;}
.err-msg{
  font-size:.75rem;color:var(--err);margin-bottom:.75rem;
  display:none;padding-right:.1rem;
}
.err-msg.on{display:block;}

/* ─── complete ─── */
.done-wrap{text-align:center;padding:1rem 0;}
.done-circle{
  width:70px;height:70px;border-radius:50%;
  background:rgba(0,91,54,.09);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 1.5rem;
}
.done-title{font-size:1.75rem;font-weight:700;letter-spacing:-.02em;color:var(--tx);margin-bottom:.4rem;}
.done-sub{font-size:.9rem;color:var(--tx2);line-height:1.6;margin-bottom:2rem;}
.summary{background:var(--sf);border:1.5px solid var(--bd);border-radius:1rem;overflow:hidden;text-align:right;}
.sum-row{display:flex;justify-content:space-between;align-items:baseline;
  padding:.75rem 1.1rem;font-size:.85rem;}
.sum-row:last-child{border-bottom:none;}
.sum-k{color:var(--tx2);}
.sum-v{font-weight:700;color:var(--tx);font-variant-numeric:tabular-nums;}

/* ─── responsive ─── */
@media(max-width:500px){
  .topbar{padding:1.1rem 1.25rem 0;}
  .content{padding:1.5rem 1.1rem 1.25rem;}
  .scr-title{font-size:1.6rem;}
  .qnum-accent{font-size:3.8rem;}
}
@media(min-width:900px){
  .topbar{padding:1.75rem 0 0;}
  .content{padding:2.5rem 1.5rem 2rem;}
}

/* ─── reduced motion ─── */
@media(prefers-reduced-motion:reduce){
  .screen,.pfill{transition-duration:.01ms!important;}
}

/* ─── shake ─── */
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-5px);}
  40%{transform:translateX(5px);}
  60%{transform:translateX(-3px);}
  80%{transform:translateX(3px);}
}
</style>

const $ = id => document.getElementById(id);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const fmt = n => (n&&+n) ? (+n).toLocaleString('en-US') : '—';
const toAr = n => String(n);

function avgPrice(){
  const qs=['cq23','cq24','cq25'], cs=['cc23','cc24','cc25'];
  let tq=0,tc=0;
  qs.forEach((k,i)=>{const q=+(D[k]||0),c=+(D[cs[i]]||0);if(q&&c){tq+=q;tc+=c;}});
  return tq ? fmt(Math.round(tc/tq)) : '—';
}

function render(q){
  let h='';
  if(q.type==='terms')      h=renderTerms();
  if(q.type==='info')       h=renderInfo();
  if(q.type==='otp')        h=renderOTP();
  if(q.type==='multi-year') h=renderMultiYear(q);
  if(q.type==='number')     h=renderNumber(q);
  if(q.type==='complete')   h=renderComplete();
  return '<div>'+h+'</div>';
}

// ── OTP ───────────────────────────────────────────────
const OTP_IDS=['o3','o2','o1','o0'];
function otpMove(el){
  const digits=el.value.replace(/\D/g,'');
  el.value=digits.slice(0,1);
  let rest=digits.slice(1);
  let i=OTP_IDS.indexOf(el.id)+1;
  while(rest && i<OTP_IDS.length){
    $(OTP_IDS[i]).value=rest[0];
    rest=rest.slice(1); i++;
  }
  if(digits){
    const nxt=$(OTP_IDS[Math.min(i,OTP_IDS.length-1)]);
    if(nxt) nxt.focus();
  }
}
function otpKey(e,el){
  if(e.key==='Backspace' && !el.value){
    const i=OTP_IDS.indexOf(el.id)-1;
    if(i>=0){const p=$(OTP_IDS[i]);p.focus();p.value='';e.preventDefault();}
  }
}
function getOTPValue(){
  return ['o3','o2','o1','o0'].map(id=>$(id)?.value||'').join('');
}
function verifyOTP(){
  const v = getOTPValue();
  if(v === SIM_OTP){ doNavigate(1); }
  else { showErr('err-otp'); }
}

// ── Validation ────────────────────────────────────────
function validate(q){
  if(q.type==='terms')
    return D.agreed ? null : {id:'err-terms'};
  if(q.type==='info'){
    if(!(D.name||'').trim()||(!(D.email||'').trim())||!(D.tel||'').trim())
      return {id:'err-info'};
  }
  if(q.type==='multi-year'){
    if(!q.keys.some(k=>D[k])) return {id:'err-my'};
  }
  if(q.type==='number'){
    if(!D[q.key]) return {id:'err-num'};
  }
  return null;
}

function showErr(id){
  const el=$(id); if(el){el.classList.add('on');}
  const stage=$('stage');
  stage.style.animation='none'; stage.offsetHeight;
  stage.style.animation='shake .32s ease';
}

// ── Navigation ────────────────────────────────────────
function next(){
  const q=SCREENS[idx];
  if(q.type==='otp'){verifyOTP();return;}
  const e=validate(q); if(e){showErr(e.id);return;}
  doNavigate(1);
}
function prev(){ doNavigate(-1); }

function doNavigate(dir){
  const ni=idx+dir;
  if(ni<0||ni>=SCREENS.length)return;

  const stage=$('stage');
  const olds=[...stage.children];
  olds.forEach(o=>{o.classList.remove('active','entering');o.classList.add('exiting');});
  const old=olds[olds.length-1]||null;

  idx=ni;
  const tmp=document.createElement('div');
  tmp.innerHTML=render(SCREENS[idx]);
  const newEl=tmp.firstElementChild;
  newEl.classList.add('screen','entering');
  stage.appendChild(newEl);

  // Lock height of stage-wrap during transition
  const wrap=$('stage').parentElement;
  if(old) wrap.style.minHeight=old.offsetHeight+'px';

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    newEl.classList.remove('entering');
    newEl.classList.add('active');
    setTimeout(()=>{
      olds.forEach(o=>{if(o.parentNode===stage)stage.removeChild(o);});
      wrap.style.minHeight='';

    },300);
  }));

  updateChrome();
}

function updateChrome(){
  const total=SCREENS.length;
  const pct=(idx/(total-1))*100;
  $('pfill').style.width=pct+'%';

  const surveySteps=SCREENS.filter(s=>!['terms','info','otp','complete'].includes(s.type));
  const surveyIdx=idx-3; // offset for setup screens
  $('steplbl').textContent=
    idx===0?'':
    idx===1||idx===2?`تجهيز ${toAr(idx)} من ${toAr(3)}`:
    idx>=SCREENS.length-1?'مكتمل':
    `سؤال ${toAr(surveyIdx+1)} من ${toAr(surveySteps.length)}`;
}

// ── Misc ──────────────────────────────────────────────
function toggleAgree(){
  D.agreed=!D.agreed; persist();
  const c=$('chk'); if(c) c.classList.toggle('on',!!D.agreed);
}

function refreshCalc(){
  const el=$('calcdisplay'); if(!el)return;
  const v=avgPrice();
  el.textContent=v==='—'?'— ريال':v+' ريال/م²';
}

let dark=false;
function toggleTheme(){
  dark=!dark;
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
}


// ── Boot ──────────────────────────────────────────────
document.documentElement.setAttribute('data-theme','light');
if(D.completed) idx = SCREENS.length-1;
const stage=$('stage');
const firstEl=document.createElement('div');
firstEl.innerHTML=render(SCREENS[idx]);
const sc=firstEl.firstElementChild;
sc.classList.add('screen','active');
stage.appendChild(sc);
updateChrome();
</script>
